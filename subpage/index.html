<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>{{ if .subTitle }}{{ .subTitle }}{{ else }}اشتراک شما{{ end }}</title>
<style>
:root {
  --bg: #f3f5f9; --card: #ffffff; --text: #1d2433; --muted: #6b7489; --line: #e3e7ef;
  --accent: #2f6fed; --accent-soft: #e8f0ff; --ok: #14a05b; --warn: #e08a00; --bad: #d62839;
  --shadow: 0 1px 2px rgba(20, 30, 60, .06), 0 4px 16px rgba(20, 30, 60, .06);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0f131b; --card: #181e2a; --text: #e6e9f0; --muted: #8d96aa; --line: #273043;
    --accent: #5b8cff; --accent-soft: #1d2a47; --ok: #2fc47a; --warn: #f0a531; --bad: #ff4d5e;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 4px 16px rgba(0, 0, 0, .25);
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text); line-height: 1.7; -webkit-text-size-adjust: 100%;
  font-family: Vazirmatn, "Vazir", "IRANSans", "Segoe UI", Tahoma, system-ui, sans-serif;
}
.wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 40px; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 8px 0 16px; }
h1 { font-size: 1.25rem; margin: 0; }
h2 { font-size: 1rem; margin: 0 0 12px; }
.muted { color: var(--muted); }
.sm { font-size: .82rem; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 12px; font-size: .82rem; background: var(--accent-soft); white-space: nowrap; }
.pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.pill.on .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.stat { background: var(--bg); border-radius: 12px; padding: 10px 12px; min-width: 0; }
.stat b { display: block; font-size: 1.08rem; overflow-wrap: anywhere; }
.bar { height: 10px; border-radius: 99px; background: var(--line); overflow: hidden; margin: 8px 0 4px; }
.bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: var(--ok); transition: width .6s ease; }
.bar i.warn { background: var(--warn); }
.bar i.bad { background: var(--bad); }
.row { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line);
  background: var(--card); color: var(--text); border-radius: 10px; padding: 8px 14px; font: inherit; font-size: .9rem;
  cursor: pointer; text-decoration: none; min-height: 40px;
}
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.url {
  direction: ltr; text-align: left; font-family: ui-monospace, Consolas, monospace; font-size: .8rem; background: var(--bg);
  border-radius: 10px; padding: 10px 12px; overflow-wrap: anywhere; margin-bottom: 10px; user-select: all;
}
.tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.tab { border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 99px; padding: 4px 14px; font: inherit; font-size: .85rem; cursor: pointer; }
.tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.apps { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 8px; }
.cfg { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 10px 0; border-top: 1px solid var(--line); }
.cfg:first-of-type { border-top: 0; }
.cfg .name { min-width: 0; overflow-wrap: anywhere; }
.cfg .proto { font-size: .72rem; direction: ltr; display: inline-block; background: var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 0 6px; margin-inline-start: 6px; }
.cfg .btns { flex-shrink: 0; flex-wrap: nowrap; }
.cfg .btn { padding: 6px 10px; min-height: 34px; font-size: .82rem; }
.announce { white-space: pre-wrap; border-inline-start: 4px solid var(--accent); }
.alert { border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); background: color-mix(in srgb, var(--bad) 8%, var(--card)); }
.alert b { color: var(--bad); }
footer { text-align: center; margin-top: 18px; }

/* the stamp */
.stamp {
  position: fixed; inset: 0; display: none; align-items: center; justify-content: center; pointer-events: none; z-index: 20; overflow: hidden;
}
.stamp.show { display: flex; }
.stamp div {
  color: var(--bad); border: 6px double var(--bad); border-radius: 18px; padding: 14px 26px 10px; text-align: center;
  font-size: clamp(1.6rem, 8.5vw, 3.6rem); font-weight: 900; white-space: nowrap; line-height: 1.3; letter-spacing: 0;
  transform: rotate(-16deg); opacity: .82; background: color-mix(in srgb, var(--card) 55%, transparent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 20%, transparent) inset;
  animation: slam .45s cubic-bezier(.2, 1.6, .4, 1) both; max-width: 92vw;
  -webkit-mask-image: repeating-linear-gradient(35deg, #000 0 7px, rgba(0, 0, 0, .78) 7px 9px);
          mask-image: repeating-linear-gradient(35deg, #000 0 7px, rgba(0, 0, 0, .78) 7px 9px);
}
.stamp small { display: block; white-space: normal; font-size: .34em; font-weight: 700; letter-spacing: 0; margin-top: 2px; }
@keyframes slam { from { transform: rotate(-16deg) scale(2.2); opacity: 0; } to { transform: rotate(-16deg) scale(1); opacity: .82; } }
body.dead .live { filter: grayscale(1); opacity: .55; }

/* QR dialog and toast */
.modal { position: fixed; inset: 0; background: rgba(0, 0, 0, .55); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 30; }
.modal.show { display: flex; }
.modal .box { background: var(--card); border-radius: 16px; padding: 16px; width: min(360px, 100%); text-align: center; }
.modal .qr { background: #fff; border-radius: 12px; padding: 10px; margin: 10px 0; }
.modal .qr svg { width: 100%; height: auto; display: block; }
.toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); border-radius: 10px; padding: 8px 16px; opacity: 0; transition: .25s; z-index: 40; pointer-events: none; }
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
@media (max-width: 420px) {
  .grid { gap: 8px; }
  .cfg { flex-direction: column; align-items: stretch; }
  .cfg .btns .btn { flex: 1; }
}
</style>
</head>
<body>
<div class="stamp" id="stamp" aria-hidden="true"><div><span id="stamp-text"></span><small id="stamp-sub"></small></div></div>

<div class="wrap">
  <header>
    <h1 id="title"></h1>
    <span class="pill" id="online"><span class="dot"></span><span></span></span>
  </header>

  <div class="card alert" id="alert" hidden>
    <b id="alert-title"></b>
    <div id="alert-text" class="sm"></div>
    <div class="btns" style="margin-top:10px" id="alert-support" hidden><a class="btn primary" target="_blank" rel="noopener">تماس با پشتیبانی</a></div>
  </div>

  <div class="card announce" id="announce" hidden></div>

  <div class="card live">
    <h2>مصرف حجم</h2>
    <div class="row"><span id="used-line"></span><span class="muted sm" id="used-pct"></span></div>
    <div class="bar"><i id="used-bar"></i></div>
    <div class="grid" style="margin-top:12px">
      <div class="stat"><span class="muted sm">باقی‌مانده</span><b id="remain"></b></div>
      <div class="stat"><span class="muted sm">کل حجم</span><b id="total"></b></div>
      <div class="stat"><span class="muted sm">دانلود</span><b id="down"></b></div>
      <div class="stat"><span class="muted sm">آپلود</span><b id="up"></b></div>
    </div>
  </div>

  <div class="card live">
    <h2>زمان اشتراک</h2>
    <div class="row"><span id="exp-line"></span><span class="muted sm" id="exp-date"></span></div>
    <div class="bar" id="exp-barbox" hidden><i id="exp-bar"></i></div>
  </div>

  <div class="card">
    <h2>لینک اشتراک</h2>
    <div class="url" id="sub-url"></div>
    <div class="btns">
      <button class="btn primary" id="copy-sub">کپی لینک</button>
      <button class="btn" id="qr-sub">نمایش QR</button>
    </div>
    <div class="muted sm" style="margin-top:8px">این لینک را در برنامه‌ی خود «افزودن اشتراک» کنید تا کانفیگ‌ها خودکار به‌روز بمانند<span id="upd"></span>.</div>
  </div>

  <div class="card">
    <h2>افزودن خودکار به برنامه</h2>
    <div class="tabs" id="os-tabs"></div>
    <div class="apps" id="apps"></div>
  </div>

  <div class="card" id="cfg-card">
    <h2>کانفیگ‌ها <span class="muted sm" id="cfg-n"></span></h2>
    <div id="cfgs"></div>
  </div>

  <footer class="muted sm" id="foot"></footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true">
  <div class="box">
    <b id="qr-title"></b>
    <div class="qr" id="qr"></div>
    <div class="btns" style="justify-content:center">
      <button class="btn primary" id="qr-copy">کپی</button>
      <button class="btn" id="qr-close">بستن</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

    if (s < 3600) return fa(Math.round(s / 60)) + " دقیقه پیش";
    if (s < 86400) return fa(Math.round(s / 3600)) + " ساعت پیش";
    return fa(Math.round(s / 86400)) + " روز پیش";
  }
  function jdate(ms) {
    try {
      return new Date(ms).toLocaleDateString("fa-IR-u-ca-persian", { year: "numeric", month: "long", day: "numeric" });
    } catch (e) { return new Date(ms).toLocaleDateString("fa-IR"); }
  }
  var toastT;
  function toast(t) {
    var el = $("toast"); el.textContent = t; el.classList.add("show");
    clearTimeout(toastT); toastT = setTimeout(function () { el.classList.remove("show"); }, 1800);
  }
  function copy(text) {
    function fallback() {
      var ta = document.createElement("textarea");
      ta.value = text; ta.setAttribute("readonly", ""); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("کپی شد"); } catch (e) { toast("کپی نشد؛ دستی انتخاب کنید"); }
      document.body.removeChild(ta);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(function () { toast("کپی شد"); }, fallback);
    } else fallback();
  }

  var qrText = "";
  function showQR(text, title) {
    qrText = text;
    $("qr-title").textContent = title;
    var box = $("qr");
    box.innerHTML = "";
    try {
      var q = qrcode(0, text.length > 1200 ? "L" : "M");
      q.addData(text, "Byte"); q.make();
      box.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true });
    } catch (e) {
      box.innerHTML = '<div style="color:#333;padding:20px 8px">این متن برای QR بیش از حد طولانی است؛ از دکمه‌ی کپی استفاده کنید.</div>';
    }
    $("modal").classList.add("show");
  }
  $("qr-close").onclick = function () { $("modal").classList.remove("show"); };
  $("modal").onclick = function (e) { if (e.target === this) this.classList.remove("show"); };
  $("qr-copy").onclick = function () { copy(qrText); };
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") $("modal").classList.remove("show"); });

  // --- status: usage, time, stamp (re-run on every poll) ---
  function render(d) {
    var up = Number(d.uploadByte) || 0, down = Number(d.downloadByte) || 0, total = Number(d.totalByte) || 0, used = up + down;
    var now = Date.now(), exp = Number(d.expire) || 0;
    var expired = exp > 0 && exp * 1000 <= now;
    var depleted = total > 0 && used >= total;
    var off = d.enabled === false;

    $("title").textContent = d.subTitle || "اشتراک شما";
    var on = $("online");
    on.classList.toggle("on", !!d.isOnline);
    on.lastChild.textContent = d.isOnline ? "آنلاین" : (d.lastOnline > 0 ? "آخرین اتصال " + ago(d.lastOnline) : "هنوز وصل نشده");

    $("used-line").textContent = size(used) + (total ? " از " + size(total) : "");
    $("total").textContent = total ? size(total) : "نامحدود";
    $("remain").textContent = total ? size(Math.max(0, total - used)) : "نامحدود";
    $("down").textContent = size(down);
    $("up").textContent = size(up);
    var pct = total ? Math.min(100, used * 100 / total) : 0;
    var bar = $("used-bar");
    bar.style.width = (total ? pct : 0) + "%";
    bar.className = pct >= 90 ? "bad" : pct >= 75 ? "warn" : "";
    $("used-pct").textContent = total ? fa(pct, pct < 10 ? 1 : 0) + "٪ مصرف شده" : "";

    var eb = $("exp-bar");
    $("exp-barbox").hidden = true;
    if (exp > 0) {
      var left = exp * 1000 - now, days = left / 86400000;
      $("exp-date").textContent = "تا " + jdate(exp * 1000);
      if (expired) $("exp-line").textContent = "پایان یافته (" + ago(exp * 1000) + ")";
      else if (days >= 1) $("exp-line").textContent = fa(Math.floor(days)) + " روز باقی مانده";
      else $("exp-line").textContent = fa(Math.max(1, Math.floor(left / 3600000))) + " ساعت باقی مانده";
      $("exp-barbox").hidden = false;
      var dpct = Math.max(0, Math.min(100, days * 100 / 30));
      eb.style.width = (expired ? 100 : dpct) + "%";
      eb.className = expired || days < 3 ? "bad" : days < 7 ? "warn" : "";
    } else if (exp < 0) {
      $("exp-line").textContent = fa(Math.round(-exp / 86400)) + " روز، از اولین اتصال";
      $("exp-date").textContent = "هنوز شروع نشده";
    } else {
      $("exp-line").textContent = "بدون محدودیت زمانی";
      $("exp-date").textContent = "";
    }

    // the stamp: expired, out of data, both, or switched off by the admin
    var word = expired && depleted ? "منقضی شده" : expired ? "منقضی شده" : depleted ? "حجم تمام شده" : off ? "غیرفعال" : "";
    var sub = expired && depleted ? "و حجم هم تمام شده" : expired ? "زمان اشتراک به پایان رسیده" : depleted ? "حجم اشتراک مصرف شده" : off ? "این اشتراک غیرفعال شده" : "";
    $("stamp-text").textContent = word;
    $("stamp-sub").textContent = sub;
    $("stamp").classList.toggle("show", !!word);
    document.body.classList.toggle("dead", !!word);
    $("alert").hidden = !word;
    if (word) {
      $("alert-title").textContent = word === "غیرفعال" ? "این اشتراک غیرفعال است" : "اشتراک شما " + word;
      $("alert-text").textContent = "برای تمدید یا خرید حجم، با پشتیبانی تماس بگیرید. پس از تمدید، همین لینک دوباره کار می‌کند و نیاز به تغییر آن نیست.";
    }
    var sup = $("alert-support");
    sup.hidden = !(word && d.subSupportUrl);
    if (d.subSupportUrl) sup.firstChild.href = d.subSupportUrl;

    var ann = $("announce");
    ann.hidden = !d.announce;
    ann.textContent = d.announce || "";
  }

  // --- the parts that do not change while the page is open ---
  var subUrl = D.subUrl || location.href.split(/[?#]/)[0];
  $("sub-url").textContent = subUrl;
  $("copy-sub").onclick = function () { copy(subUrl); };
  $("qr-sub").onclick = function () { showQR(subUrl, "لینک اشتراک"); };
  if (D.subUpdates > 0) $("upd").textContent = " (هر " + fa(D.subUpdates) + " ساعت)";

  var enc = encodeURIComponent(subUrl), name = encodeURIComponent(D.subTitle || D.sId || "sub");
  var rocket = subUrl + (subUrl.indexOf("?") < 0 ? "?" : "&") + "flag=shadowrocket";
  var A = {
    hiddify: { n: "Hiddify", u: "hiddify://import/" + subUrl + "#" + name },
    v2box: { n: "V2Box", u: "v2box://install-sub?url=" + enc + "&name=" + name },
    v2raytun: { n: "V2RayTun", u: "v2raytun://import/" + subUrl },
    happ: { n: "Happ", u: "happ://add/" + subUrl },
    singbox: { n: "sing-box", u: "sing-box://import-remote-profile?url=" + enc + "#" + name },
    v2rayng: { n: "v2rayNG", u: "v2rayng://install-config?url=" + enc },
    streisand: { n: "Streisand", u: "streisand://import/" + enc },
    rocket: { n: "Shadowrocket", u: (function () { try { return "shadowrocket://add/sub://" + btoa(rocket) + "?remark=" + name; } catch (e) { return ""; } })() }
  };
  var OS = [
    { k: "android", n: "اندروید", a: ["v2rayng", "hiddify", "v2box", "v2raytun", "happ", "singbox"] },
    { k: "ios", n: "آیفون", a: ["streisand", "v2box", "hiddify", "rocket", "v2raytun", "happ"] },
    { k: "desktop", n: "ویندوز / مک", a: ["hiddify", "v2raytun", "happ", "singbox"] }
  ];
  var ua = navigator.userAgent || "";
  var cur = /iPhone|iPad|iPod|Macintosh.*Mobile/i.test(ua) ? "ios" : /Android/i.test(ua) ? "android" : /Windows|Macintosh|Linux/i.test(ua) ? "desktop" : "android";
  function drawApps() {
    $("os-tabs").innerHTML = "";
    OS.forEach(function (o) {
      var b = document.createElement("button");
      b.className = "tab" + (o.k === cur ? " on" : "");
      b.textContent = o.n;
      b.onclick = function () { cur = o.k; drawApps(); };
      $("os-tabs").appendChild(b);
    });
    var box = $("apps");
    box.innerHTML = "";
    OS.filter(function (o) { return o.k === cur; })[0].a.forEach(function (k) {
      if (!A[k].u) return;
      var a = document.createElement("a");
      a.className = "btn"; a.href = A[k].u; a.textContent = A[k].n; a.rel = "noopener";
      box.appendChild(a);
    });
  }
  drawApps();

  var links = D.links || [];
  $("cfg-n").textContent = links.length ? "(" + fa(links.length) + ")" : "";
  $("cfg-card").hidden = !links.length;
  links.forEach(function (l, i) {
    var label = "";
    var h = l.indexOf("#");
    if (h >= 0) { try { label = decodeURIComponent(l.slice(h + 1)); } catch (e) { label = l.slice(h + 1); } }
    var proto = (l.match(/^([a-z0-9]+):\/\//i) || [])[1] || "";
    if (!label && proto === "vmess") {
      try { label = JSON.parse(atob(l.slice(8))).ps || ""; } catch (e) {}
    }
    label = label || ("کانفیگ " + fa(i + 1));
    var row = document.createElement("div");
    row.className = "cfg";
    var nm = document.createElement("div");
    nm.className = "name";
    nm.textContent = label;
    if (proto) { var p = document.createElement("span"); p.className = "proto"; p.textContent = proto; nm.appendChild(p); }
    var bt = document.createElement("div");
    bt.className = "btns";
    var c = document.createElement("button"); c.className = "btn"; c.textContent = "کپی"; c.onclick = function () { copy(l); };
    var q = document.createElement("button"); q.className = "btn"; q.textContent = "QR"; q.onclick = function () { showQR(l, label); };
    bt.appendChild(c); bt.appendChild(q);
    row.appendChild(nm); row.appendChild(bt);
    $("cfgs").appendChild(row);
  });

  render(D);
  $("foot").textContent = "به‌روزرسانی: " + new Date().toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" });

  // keep the numbers fresh while the page stays open
  var infoUrl = location.pathname + (location.search ? location.search + "&" : "?") + "format=info";
  setInterval(function () {
    if (document.hidden) return;
    fetch(infoUrl, { cache: "no-store" }).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
      if (!d) return;
      render(d);
      $("foot").textContent = "به‌روزرسانی: " + new Date().toLocaleTimeString("fa-IR", { hour: "2-digit", minute: "2-digit" });
    }).catch(function () {});
  }, 30000);
})();
</script>
</body>
</html>
