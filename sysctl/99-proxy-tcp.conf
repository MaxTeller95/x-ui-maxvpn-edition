# TCP tuning for proxied connections (users <-> x-ui <-> tunnel <-> x-ui abroad).
# Use on the hub and on the servers abroad:
#   cp 99-proxy-tcp.conf /etc/sysctl.d/ && sysctl -p /etc/sysctl.d/99-proxy-tcp.conf
# No restart needed. BBR + cake are assumed to be set up already (mtunnel does that).

# An idle proxy connection keeps its congestion window instead of restarting slow start.
net.ipv4.tcp_slow_start_after_idle = 0
# Keep unsent data in the socket small: less queueing delay under load.
net.ipv4.tcp_notsent_lowat = 16384
# Recover when an ICMP "fragmentation needed" is lost on the path (PMTU black hole).
net.ipv4.tcp_mtu_probing = 1
